{{/* expects dict "pages" (list of pages) */}}
<ul class="listing">
  {{ range .pages }}
    <li>
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 2, 2006" }}</time>
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>
    </li>
  {{ else }}
    <li class="empty">Nothing here yet.</li>
  {{ end }}
</ul>
